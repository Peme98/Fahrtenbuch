<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meine Arbeitsapps</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--p:#007f78;--bg:#f3f6f8;--card:#fff;--text:#183039;--muted:#698087;--line:#dce5e8}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:linear-gradient(135deg,#e6f5f3,#f8fafc);color:var(--text);min-height:100vh}main{max-width:900px;margin:auto;padding:8vh 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 15px 45px #16343c15}.auth{max-width:440px;margin:auto}h1{margin:0 0 5px}.muted{color:var(--muted)}label{display:block;margin-top:14px;font-size:12px;font-weight:700;text-transform:uppercase}input,button{width:100%;padding:12px;border-radius:11px;font:inherit}input{border:1px solid var(--line);margin-top:6px}button{border:0;cursor:pointer;font-weight:700;background:var(--p);color:white;margin-top:10px}.secondary{background:#e6f5f3;color:#006761}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px}.top button{width:auto;margin:0}.apps{display:grid;grid-template-columns:1fr 1fr;gap:18px}.app{text-decoration:none;color:inherit;transition:.2s}.app:hover{transform:translateY(-3px)}.app strong{display:block;font-size:22px;margin:12px 0 5px}.emoji{font-size:38px}.hide{display:none}@media(max-width:650px){.apps{grid-template-columns:1fr}}</style></head><body><main><section id="auth" class="card auth"><h1>Anmelden</h1><p class="muted">Ein Konto für Fahrtenbuch und Zeiterfassung.</p><label>E-Mail<input id="email" type="email"></label><label>Passwort<input id="password" type="password"></label><button id="login">Anmelden</button><button id="signup" class="secondary">Registrieren</button><button id="reset" class="secondary">Passwort vergessen</button><p id="msg" class="muted"></p></section><section id="portal" class="hide"><div class="top"><div><h1>Meine Arbeitsapps</h1><span id="user" class="muted"></span></div><button id="logout">Abmelden</button></div><div class="apps"><a class="card app" href="fahrtenbuch.html"><span class="emoji">🚗</span><strong>Fahrtenbuch</strong><span class="muted">Fahrten, Arbeitswege und Dienstreisen erfassen</span></a><a class="card app" href="zeiterfassung.html"><span class="emoji">⏱️</span><strong>Zeiterfassung</strong><span class="muted">Arbeitszeiten, Wochen und Saldo verwalten</span></a></div></section></main><script>const db=supabase.createClient('https://qgjtghhyjekafrmegoyi.supabase.co','sb_publishable_mBuWVbjXvuLev_Ms2Nu8Zg_B3lXCg4-'),$=x=>document.getElementById(x);async function act(signup){let e=$('email').value.trim(),p=$('password').value,r=signup?await db.auth.signUp({email:e,password:p}):await db.auth.signInWithPassword({email:e,password:p});$('msg').textContent=r.error?r.error.message:(signup&&!r.data.session?'Bitte bestätige deine E-Mail.':'Erfolgreich angemeldet.')}$('login').onclick=()=>act(false);$('signup').onclick=()=>act(true);$('reset').onclick=async()=>{let e=$('email').value.trim();if(!e)return $('msg').textContent='Bitte E-Mail eingeben.';let r=await db.auth.resetPasswordForEmail(e,{redirectTo:location.href});$('msg').textContent=r.error?r.error.message:'E-Mail wurde versendet.'};$('logout').onclick=()=>db.auth.signOut();function show(s){let u=s?.user;$('auth').classList.toggle('hide',!!u);$('portal').classList.toggle('hide',!u);$('user').textContent=u?.email||''}db.auth.onAuthStateChange((_,s)=>show(s));db.auth.getSession().then(r=>show(r.data.session));</script></body></html>
