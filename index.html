<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mein Fahrtenbuch</title><style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--teal:#0d9488;--field:#fff}.dark{--bg:#020617;--card:#0f172a;--text:#f8fafc;--muted:#94a3b8;--line:#334155;--field:#020617}*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);transition:.25s}.wrap{max-width:1200px;margin:auto;padding:24px}.head,.row,.between{display:flex;align-items:center}.head,.between{justify-content:space-between}.logo{display:flex;gap:12px;align-items:center}.icon{background:var(--teal);color:#fff;padding:12px;border-radius:16px;font-size:22px}.btn,input,select,textarea{border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit}.btn{cursor:pointer;font-weight:700}.primary{background:var(--teal);color:#fff;border:0}.danger{color:#e11d48}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.card,.trip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 2px 8px #0000000d}.stat small,label span{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.stat b{display:block;font-size:21px;margin-top:6px}.layout{display:grid;grid-template-columns:380px 1fr;gap:22px}.card{border-radius:24px}.form{display:grid;gap:14px}label{display:grid;gap:6px}input,select,textarea{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stop{display:flex;gap:8px;margin-bottom:8px}.checkline{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}.checkline input{width:auto;margin:0}.checkline span{text-transform:none;font-size:14px;color:var(--text)}.notice{background:#ccfbf1;color:#115e59;padding:12px;border-radius:14px}.dark .notice{background:#134e4a;color:#ccfbf1}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.trip{margin-bottom:10px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.work{background:#ccfbf1;color:#115e59}.business{background:#fef3c7;color:#92400e}.return{background:#e0e7ff;color:#3730a3}.trip{position:relative}.menuwrap{position:absolute;right:12px;top:12px}.menubtn{width:36px;height:36px;padding:0;font-size:22px;line-height:1}.menu{position:absolute;right:0;top:40px;z-index:20;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 14px 34px #0003}.menu button{display:block;width:100%;border:0;background:transparent;color:var(--text);padding:9px 10px;text-align:left;border-radius:9px;cursor:pointer}.menu button:hover{background:var(--bg)}.menu .delete{color:#e11d48}.muted{color:var(--muted)}.settings{margin:10px 0}.hide{display:none}@media(max-width:850px){.grid4{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.wrap{padding:14px}}@media(max-width:480px){.grid4{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="head"><div class="logo"><div class="icon">🚗</div><div><h1 style="margin:0">Mein Fahrtenbuch</h1><div class="muted">Arbeitsweg und Dienstreise sauber getrennt</div></div></div><button class="btn" id="theme">🌙</button></header><section class="grid4" id="stats"></section><main class="layout"><section class="card"><div class="between"><h2 id="formTitle">Neue Fahrt</h2><button id="cancel" class="btn hide">✕</button></div><form id="form" class="form"><label><span>Datum</span><input id="date" type="date" required></label><label><span>Startort</span><input id="start" list="places" placeholder="Tippe z. B. p für Privat" required></label><div><label><span>Ziel / Zwischenziele</span></label><div id="stops"></div><button type="button" class="btn" id="addStop">＋ Weiteres Ziel</button></div><label class="checkline" id="roundTripLine"><input id="roundTrip" type="checkbox"><span>Hin und zurück in einer Fahrt erfassen</span></label><div class="two"><label><span>Gesamtstrecke (km)</span><input id="km" type="number" min="0.1" step="0.1" required></label><label><span>Zweck</span><select id="purpose"><option>Dienstreise</option><option>Arbeitsweg</option><option>Kundenbesuch</option><option>Fortbildung</option><option>Sonstiges</option></select></label></div><div id="preview" class="notice hide"></div><div id="singleTimes" class="two"><label><span>Startzeit</span><input id="startTime" type="time"></label><label><span>Endzeit</span><input id="endTime" type="time"></label></div><div id="roundTripTimes" class="hide"><div class="two"><label><span>Hinfahrt · Abfahrt</span><input id="outStartTime" type="time"></label><label><span>Hinfahrt · Ankunft</span><input id="outEndTime" type="time"></label></div><div class="two" style="margin-top:10px"><label><span>Rückfahrt · Abfahrt</span><input id="returnStartTime" type="time"></label><label><span>Rückfahrt · Ankunft</span><input id="returnEndTime" type="time"></label></div></div><label><span>Notiz</span><textarea id="note" rows="2"></textarea></label><button class="btn primary">💾 Fahrt speichern</button></form></section><section><div class="between"><div><h2 style="margin-bottom:3px">Fahrtenübersicht</h2><div id="count" class="muted"></div></div><div class="row" style="gap:8px"><select id="year"></select><button class="btn" id="settingsBtn">Orte & Strecke</button></div></div><section id="settings" class="card settings hide"><h3>Automatische Erkennung</h3><p class="muted">Mehrere Ortsnamen mit Komma trennen. Die Entfernung gilt für eine einfache Fahrt.</p><div class="two"><label><span>Private Orte</span><input id="privatePlaces"></label><label><span>Arbeitsstätten</span><input id="workPlaces"></label><label><span>Entfernung zur Arbeit (km)</span><input id="commuteKm" type="number" min="0" step="0.1"></label><label><span>Weitere Ortsvorschläge</span><input id="otherPlaces"></label></div></section><div class="tools"><button class="btn" id="backup">⬇ JSON-Backup</button><label class="btn">⬆ Import<input id="import" type="file" accept=".json" hidden></label><button class="btn" id="csv">▦ CSV</button></div><div id="list"></div></section></main><datalist id="places"></datalist><p class="muted" style="text-align:center;margin-top:28px">Daten werden lokal in diesem Browser gespeichert. Bitte regelmäßig ein Backup exportieren.</p></div><script>
const T='fahrtenbuch-v2-trips',S='fahrtenbuch-v2-settings',D='fahrtenbuch-dark';let trips=JSON.parse(localStorage.getItem(T)||'[]'),settings=JSON.parse(localStorage.getItem(S)||'null')||{privatePlaces:'Privat, Zuhause, Wohnung',workPlaces:'Niederlassung, Büro, Hauptarbeitsstätte',commuteKm:'20',places:'Kunde, Hotel, Bahnhof, Flughafen'},editing=null;const $=x=>document.getElementById(x),split=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean),norm=s=>String(s||'').trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' '),isIn=(s,a)=>split(a).some(x=>norm(x)===norm(s));
function directCommute(t){return t.stops?.length===1&&((isIn(t.start,settings.privatePlaces)&&isIn(t.stops[0],settings.workPlaces))||(isIn(t.start,settings.workPlaces)&&isIn(t.stops[0],settings.privatePlaces)))}function commuteConnection(t){let route=[t.start,...(t.stops||[])];return route.some((place,i)=>i>0&&((isIn(route[i-1],settings.privatePlaces)&&isIn(place,settings.workPlaces))||(isIn(route[i-1],settings.workPlaces)&&isIn(place,settings.privatePlaces))))}function alloc(t){let total=Math.max(0,+t.km||0),connected=commuteConnection(t);if(!connected)return{commute:0,business:total,returnKm:0,via:false};let idx=trips.findIndex(y=>y.id===t.id),earlier=trips.some((x,i)=>x.date===t.date&&x.id!==t.id&&commuteConnection(x)&&(idx<0||i<idx));if(earlier)return{commute:0,business:t.roundTrip?0:total,returnKm:t.roundTrip?total:0,via:false};let commute=Math.min(total,Math.max(0,+settings.commuteKm||0)),returnKm=t.roundTrip?Math.max(0,total-commute):0;return{commute,business:t.roundTrip?0:Math.max(0,total-commute),returnKm,via:true}}function autoDistance(){let t={start:$('start').value,stops:stopValues()},direct=directCommute(t),factor=$('roundTrip').checked?2:1;if(direct&&!$('km').dataset.manual){$('km').value=(Math.max(0,+settings.commuteKm||0)*factor);$('purpose').value='Arbeitsweg'}else if(!direct&&$('km').dataset.auto==='1'){$('km').value='';$('roundTrip').checked=false}$('roundTripLine').classList.toggle('hide',!direct);$('km').dataset.auto=direct?'1':'0';preview()}
function saveAll(){localStorage.setItem(T,JSON.stringify(trips));localStorage.setItem(S,JSON.stringify(settings))}function stopRow(v=''){let d=document.createElement('div');d.className='stop';d.innerHTML=`<input list="places" placeholder="Ziel" value="${esc(v)}"><button type="button" class="btn danger">✕</button>`;d.querySelector('button').onclick=()=>{if($('stops').children.length>1)d.remove();preview()};d.querySelector('input').oninput=autoDistance;$('stops').append(d)}function stopValues(){return [...$('stops').querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let years=[...new Set([String(new Date().getFullYear()),...trips.map(t=>t.date.slice(0,4))])].sort().reverse(),current=$('year').value||years[0];$('year').innerHTML=years.map(y=>`<option ${y===current?'selected':''}>${y}</option>`).join('');let visible=trips.filter(t=>t.date.startsWith($('year').value)).sort((a,b)=>b.date.localeCompare(a.date)),s=visible.reduce((a,t)=>{let x=alloc(t);a.total+=+t.km;a.commute+=x.commute;a.business+=x.business;a.n+=x.commute>0;return a},{total:0,commute:0,business:0,n:0});$('stats').innerHTML=[['Gesamtkilometer',s.total+' km'],['Arbeitsweg',s.commute+' km'],['Dienstlich',s.business+' km'],['Fahrten zur Arbeit',s.n]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('count').textContent=`${visible.length} Fahrten im Jahr ${$('year').value}`;$('list').innerHTML=visible.length?visible.map(t=>{let a=alloc(t);return`<article class="trip" style="padding-right:58px"><div class="menuwrap"><button class="btn menubtn" aria-label="Aktionen" onclick="toggleTripMenu(event,'${t.id}')">⋮</button><div class="menu hide" id="menu-${t.id}"><button onclick="editTrip('${t.id}');closeMenus()">✎ Bearbeiten</button><button onclick="duplicateTrip('${t.id}');closeMenus()">⧉ Duplizieren</button><button class="delete" onclick="deleteTrip('${t.id}');closeMenus()">⌫ Löschen</button></div></div><div class="between"><div><small class="muted">${new Date(t.date+'T12:00').toLocaleDateString('de-DE')}</small><h3>${[t.start,...t.stops].map(esc).join(' → ')}</h3></div><b>${t.km} km</b></div><div class="muted" style="margin-top:8px;font-size:12px">${t.roundTrip?`Hinfahrt ${t.outStartTime||'–'}–${t.outEndTime||'–'} · Rückfahrt ${t.returnStartTime||'–'}–${t.returnEndTime||'–'}`:((t.startTime||t.endTime)?`Zeit ${t.startTime||'–'}–${t.endTime||'–'}`:'')}</div><div class="tags">${a.commute?`<span class="tag work">Arbeitsweg ${a.commute} km</span>`:''}${a.business?`<span class="tag business">Dienstlich ${a.business} km</span>`:''}${a.returnKm?`<span class="tag return">Rückweg ${a.returnKm} km</span>`:''}</div></article>`}).join(''):'<div class="card muted">Noch keine Fahrten vorhanden.</div>';let sugg=[...new Set([...split(settings.privatePlaces),...split(settings.workPlaces),...split(settings.places),...trips.flatMap(t=>[t.start,...t.stops])])];$('places').innerHTML=sugg.map(x=>`<option value="${esc(x)}">`).join('')}
function preview(){let a=alloc({id:editing||'',date:$('date').value,start:$('start').value,stops:stopValues(),km:$('km').value,roundTrip:$('roundTrip').checked}),p=$('preview');p.classList.toggle('hide',!a.via||!+$('km').value);p.innerHTML=$('roundTrip').checked?`<b>Hin und zurück erfasst</b><br>${+$('km').value||0} km tatsächlich gefahren · ${a.commute} km einfacher Arbeitsweg für diesen Tag`:`<b>Automatisch aufgeteilt</b><br>${a.commute} km Arbeitsweg + ${a.business} km Dienstreise`}
function reset(){editing=null;delete $('form').dataset.duplicateId;$('form').reset();$('km').dataset.manual='';$('km').dataset.auto='0';$('roundTrip').checked=false;$('roundTripLine').classList.add('hide');toggleTimeFields();$('date').value=new Date().toISOString().slice(0,10);$('stops').innerHTML='';stopRow();$('formTitle').textContent='Neue Fahrt';$('cancel').classList.add('hide');preview()}
$('form').onsubmit=e=>{e.preventDefault();let t={id:editing||$('form').dataset.duplicateId||crypto.randomUUID(),date:$('date').value,start:$('start').value.trim(),stops:stopValues(),km:+$('km').value,purpose:$('purpose').value,startTime:$('startTime').value,endTime:$('endTime').value,outStartTime:$('outStartTime').value,outEndTime:$('outEndTime').value,returnStartTime:$('returnStartTime').value,returnEndTime:$('returnEndTime').value,note:$('note').value,roundTrip:$('roundTrip').checked};if(!t.stops.length)return alert('Bitte mindestens ein Ziel angeben.');trips=editing?trips.map(x=>x.id===editing?t:x):[...trips,t];saveAll();reset();render()};window.editTrip=id=>{delete $('form').dataset.duplicateId;let t=trips.find(x=>x.id===id);editing=id;$('km').dataset.manual='1';$('km').dataset.auto='0';$('roundTrip').checked=false;$('roundTripLine').classList.add('hide');toggleTimeFields();$('date').value=t.date;$('start').value=t.start;$('stops').innerHTML='';t.stops.forEach(stopRow);$('km').value=t.km;$('purpose').value=t.purpose;$('startTime').value=t.startTime||'';$('endTime').value=t.endTime||'';$('outStartTime').value=t.outStartTime||'';$('outEndTime').value=t.outEndTime||'';$('returnStartTime').value=t.returnStartTime||'';$('returnEndTime').value=t.returnEndTime||'';$('note').value=t.note||'';$('roundTrip').checked=!!t.roundTrip;toggleTimeFields();$('formTitle').textContent='Fahrt bearbeiten';$('cancel').classList.remove('hide');preview();scrollTo({top:0,behavior:'smooth'})};window.closeMenus=()=>document.querySelectorAll('.menu').forEach(m=>m.classList.add('hide'));window.toggleTripMenu=(event,id)=>{event.stopPropagation();let menu=$('menu-'+id),wasOpen=!menu.classList.contains('hide');closeMenus();if(!wasOpen)menu.classList.remove('hide')};document.addEventListener('click',closeMenus);window.duplicateTrip=id=>{let source=trips.find(x=>x.id===id);if(!source)return;let copy={...source,id:crypto.randomUUID(),date:new Date().toISOString().slice(0,10)};editing=null;$('date').value=copy.date;$('start').value=copy.start;$('stops').innerHTML='';copy.stops.forEach(stopRow);$('km').value=copy.km;$('km').dataset.manual='1';$('km').dataset.auto='0';$('purpose').value=copy.purpose;$('startTime').value=copy.startTime||'';$('endTime').value=copy.endTime||'';$('outStartTime').value=copy.outStartTime||'';$('outEndTime').value=copy.outEndTime||'';$('returnStartTime').value=copy.returnStartTime||'';$('returnEndTime').value=copy.returnEndTime||'';$('note').value=copy.note||'';$('roundTrip').checked=!!copy.roundTrip;toggleTimeFields();$('formTitle').textContent='Duplizierte Fahrt bearbeiten';$('cancel').classList.remove('hide');$('form').dataset.duplicateId=copy.id;preview();scrollTo({top:0,behavior:'smooth'})};window.deleteTrip=id=>{if(confirm('Fahrt wirklich löschen?')){trips=trips.filter(x=>x.id!==id);saveAll();render()}};
function toggleTimeFields(){$('singleTimes').classList.toggle('hide',$('roundTrip').checked);$('roundTripTimes').classList.toggle('hide',!$('roundTrip').checked)}$('addStop').onclick=()=>stopRow();$('roundTrip').onchange=()=>{$('km').dataset.manual='';toggleTimeFields();autoDistance()};$('cancel').onclick=reset;$('start').oninput=autoDistance;$('km').oninput=()=>{$('km').dataset.manual='1';$('km').dataset.auto='0';preview()};$('year').onchange=render;$('settingsBtn').onclick=()=>$('settings').classList.toggle('hide');[['privatePlaces','privatePlaces'],['workPlaces','workPlaces'],['commuteKm','commuteKm'],['otherPlaces','places']].forEach(([id,k])=>{$(id).value=settings[k];$(id).oninput=()=>{settings[k]=$(id).value;saveAll();preview();render()}});function download(n,s,t){let u=URL.createObjectURL(new Blob([s],{type:t})),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}$('backup').onclick=()=>download('fahrtenbuch-backup.json',JSON.stringify({version:2,settings,trips},null,2),'application/json');$('csv').onclick=()=>{let v=trips.filter(t=>t.date.startsWith($('year').value)),rows=[['Datum','Start','Route','Gesamt-km','Arbeitsweg-km','Dienstreise-km','Zweck','Startzeit','Endzeit','Hinfahrt Abfahrt','Hinfahrt Ankunft','Rückfahrt Abfahrt','Rückfahrt Ankunft','Notiz','Hin und zurück'],...v.map(t=>{let a=alloc(t);return[t.date,t.start,t.stops.join(' -> '),t.km,a.commute,a.business,t.purpose,t.startTime,t.endTime,t.outStartTime||'',t.outEndTime||'',t.returnStartTime||'',t.returnEndTime||'',t.note,t.roundTrip?'Ja':'Nein']})],q=x=>'"'+String(x??'').replaceAll('"','""')+'"';download('fahrtenbuch-'+$('year').value+'.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')};$('import').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);trips=Array.isArray(d)?d:d.trips;if(d.settings)settings=d.settings;saveAll();location.reload()}catch{alert('Ungültige Datei')}};r.readAsText(e.target.files[0])};$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem(D,document.body.classList.contains('dark')?'1':'0');$('theme').textContent=document.body.classList.contains('dark')?'☀️':'🌙'};if(localStorage.getItem(D)==='1'){document.body.classList.add('dark');$('theme').textContent='☀️'}reset();render();
</script></body></html>
